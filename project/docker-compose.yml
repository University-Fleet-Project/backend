services:
  db:
    image: postgres:16
    container_name: fleet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet-network

  backend:
    build: .
    container_name: fleet-backend
    environment:
      DB_USER: postgres
      DB_HOST: db
      DB_DATABASE: fleet_db
      DB_PASSWORD: 1234
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fleet-network

networks:
  fleet-network:
    driver: bridge